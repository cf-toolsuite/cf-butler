name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  check_suite:
    types:
      - completed
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve eligible Dependabot PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=""

          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            pr_number=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
            pr_url=$(jq -r '.pull_request.html_url // empty' "$GITHUB_EVENT_PATH")
          else
            pr_number=$(jq -r '.check_suite.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            head_sha=$(jq -r '.check_suite.head_sha // empty' "$GITHUB_EVENT_PATH")

            if [ -z "$pr_number" ] && [ -n "$head_sha" ]; then
              pr_number=$(gh api "repos/${{ github.repository }}/commits/${head_sha}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '.[] | select(.state == "open") | .number' | head -n 1)
            fi
          fi

          if [ -n "$pr_number" ] && [ -z "$pr_url" ]; then
            pr_url=$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json url --jq '.url')
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Detect workflow file changes
        id: changed-files
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -q '^.github/workflows/'; then
            echo "touches_workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches_workflows=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require dedicated token for workflow changes
        if: >
          steps.pr.outputs.number != '' &&
          steps.changed-files.outputs.touches_workflows == 'true'
        env:
          AUTOMERGE_GH_TOKEN: ${{ secrets.AUTOMERGE_GH_TOKEN }}
        run: |
          if [ -n "$AUTOMERGE_GH_TOKEN" ]; then
            exit 0
          fi
          echo "Dependabot PR modifies .github/workflows/*, but AUTOMERGE_GH_TOKEN is not configured." >&2
          echo "Configure a repo secret named AUTOMERGE_GH_TOKEN with Pull requests: Write, Contents: Write, and Workflows: Write." >&2
          exit 1

      - name: Enable squash auto-merge when Merge Ready passes
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_GH_TOKEN != '' && secrets.AUTOMERGE_GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          result=$(bash .github/scripts/dependabot-automerge-check.sh "$REPO" "$PR_NUMBER")
          echo "gate=$result"
          if [ "$result" = "ready" ]; then
            gh pr merge --auto --squash --repo "$REPO" "$PR_NUMBER"
            echo "Auto-merge enabled for PR #$PR_NUMBER."
          fi

  sweep:
    name: Sweep open Dependabot PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable auto-merge for ready Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_GH_TOKEN != '' && secrets.AUTOMERGE_GH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_DEDICATED_TOKEN: ${{ secrets.AUTOMERGE_GH_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          mapfile -t prs < <(gh pr list --repo "$REPO" --author "app/dependabot" \
            --json number,isDraft,mergeStateStatus \
            --jq '.[] | select(.isDraft == false and .mergeStateStatus == "CLEAN") | .number')

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No mergeable open Dependabot PRs to sweep."
            exit 0
          fi

          for pr in "${prs[@]}"; do
            result=$(bash .github/scripts/dependabot-automerge-check.sh "$REPO" "$pr")
            echo "PR #$pr gate=$result"

            if [ "$result" != "ready" ]; then
              continue
            fi

            # Only auto-merge workflow-touching PRs when the dedicated token is configured.
            touches_workflows=$(gh api "repos/${REPO}/pulls/${pr}/files" --paginate \
              --jq '[.[].filename | select(startswith(".github/workflows/"))] | length')
            if [ "$touches_workflows" -ge 1 ] && [ "$HAS_DEDICATED_TOKEN" != "true" ]; then
              echo "PR #$pr touches workflows; skipping without AUTOMERGE_GH_TOKEN."
              continue
            fi

            gh pr merge --auto --squash --repo "$REPO" "$pr"
            echo "PR #$pr auto-merge enabled."
          done

  notify-on-auto-merge-failure:
    name: Notify when dependabot auto-merge fails
    needs: [enable-auto-merge, sweep]
    if: always() && (needs.enable-auto-merge.result == 'failure' || needs.sweep.result == 'failure')
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - name: Post failed dependabot PR notification to Slack
        if: ${{ env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "Dependabot PR needs attention: ${{ needs.enable-auto-merge.outputs.pr_url != '' && needs.enable-auto-merge.outputs.pr_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
